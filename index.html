<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Шлях Офлайн</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="https://unpkg.com/protomaps-leaflet@4.0.1/dist/protomaps-leaflet.js"></script>
<style>
  :root {
    --bg: #111418; --panel: rgba(20,24,30,.94); --text: #f2f4f7; --muted: #9aa4b2;
    --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444; --dr: #3b82f6; --btn: #262c35; --btn-on: #3b4452;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; background: #d9d4cc; }
  .bar { position: absolute; left: 8px; right: 8px; z-index: 1000; background: var(--panel);
    border-radius: 14px; padding: 8px 10px; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  #top { top: calc(8px + env(safe-area-inset-top)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #bottom { bottom: calc(8px + env(safe-area-inset-bottom)); }
  #badge { font-weight: 700; padding: 6px 10px; border-radius: 10px; font-size: 15px; white-space: nowrap; }
  .b-ok { background: var(--ok); color: #04210f; } .b-warn { background: var(--warn); color: #2a1a00; }
  .b-bad { background: var(--bad); color: #fff; } .b-dr { background: var(--dr); color: #fff; }
  .b-none { background: #4b5563; color: #fff; }
  .stat { font-size: 14px; color: var(--muted); } .stat b { color: var(--text); font-size: 17px; }
  #msg { width: 100%; font-size: 13px; color: var(--muted); }
  #msg:empty { display: none; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row + .row { margin-top: 6px; }
  button { flex: 1 1 auto; min-height: 48px; min-width: 48px; border: 0; border-radius: 12px; background: var(--btn);
    color: var(--text); font: 600 15px system-ui, sans-serif; padding: 6px 10px; cursor: pointer; }
  button:active { filter: brightness(1.3); }
  button.on { background: var(--btn-on); outline: 2px solid var(--dr); }
  button.primary { background: var(--dr); }
  #drRow { align-items: center; }
  #drRow.hidden, .hidden { display: none !important; }
  #drSpeed { font-size: 20px; font-weight: 700; min-width: 90px; text-align: center; }
  #target { display: flex; align-items: center; gap: 10px; }
  #arrow { width: 40px; height: 40px; transition: transform .3s; }
  #hint { position: absolute; z-index: 1001; left: 50%; top: 45%; transform: translate(-50%,-50%);
    background: var(--panel); padding: 12px 16px; border-radius: 12px; text-align: center; pointer-events: none; max-width: 85vw; }
  .sheet { position: absolute; inset: 0; z-index: 2000; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; }
  .sheet > div { background: #181c22; width: 100%; max-height: 80vh; overflow: auto; border-radius: 16px 16px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 10px; }
  .sheet p { color: var(--muted); font-size: 14px; margin: 6px 0 10px; }
  .place { display: flex; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid #2a313b; }
  .place span { flex: 1; } .place button { flex: 0 0 auto; min-height: 40px; }
  label.chk { display: flex; gap: 10px; align-items: center; padding: 8px 0; }
  label.chk input { width: 22px; height: 22px; }
  .me-icon { width: 26px; height: 26px; }
  #step { display: flex; gap: 12px; align-items: center; background: #1e3a8a; border-radius: 12px; padding: 8px 12px; margin-bottom: 6px; }
  #step.hidden { display: none; }
  #stepIcon { font-size: 40px; line-height: 1; width: 44px; text-align: center; }
  #stepDist { font-size: 24px; font-weight: 800; }
  #stepText { font-size: 15px; color: #dbeafe; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inp { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid #3b4452; background: #0f1216;
    color: var(--text); padding: 0 12px; font-size: 16px; }
  .place small { font-size: 12px; }
  /* нічний режим: темна карта */
  body.night .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.8) contrast(.9) saturate(.7); }
  body.night #map { background: #1a1d21; }
  .leaflet-control-attribution { font-size: 10px; }
</style>
</head>
<body>
<div id="map"></div>

<div id="top" class="bar">
  <span id="badge" class="b-none">Немає GPS</span>
  <span class="stat">Швидк. <b id="spd">—</b> км/г</span>
  <span class="stat">Точн. <b id="acc">—</b></span>
  <span id="obdTag" class="stat hidden" style="color:var(--ok);font-weight:700">OBD</span>
  <div id="msg"></div>
</div>

<div id="hint" class="hidden"></div>

<div id="bottom" class="bar">
  <div id="step" class="hidden">
    <div id="stepIcon">↱</div>
    <div style="flex:1;min-width:0"><div id="stepDist">—</div><div id="stepText"></div></div>
  </div>
  <div id="target" class="row hidden">
    <svg id="arrow" viewBox="0 0 40 40"><path d="M20 3 L32 35 L20 27 L8 35 Z" fill="#f59e0b"/></svg>
    <div style="flex:1"><b id="tDist">—</b> <span class="stat" id="tName"></span><br><span class="stat" id="tBear"></span></div>
    <button id="reroute" class="hidden" style="flex:0 0 auto">↻ Маршрут</button>
    <button id="tClear" style="flex:0 0 auto">✕</button>
  </div>
  <div id="drRow" class="row hidden">
    <button id="spdMinus">−10</button>
    <div id="drSpeed">0 км/г</div>
    <button id="spdPlus">+10</button>
    <button id="useGps" class="hidden">Прийняти GPS</button>
  </div>
  <div class="row">
    <button id="bFollow" class="on" title="Слідувати">◎ Слідувати</button>
    <button id="bHere">📍 Я тут</button>
    <button id="bDR">🧭 Без GPS</button>
  </div>
  <div class="row">
    <button id="bPlaces">★ Місця</button>
    <button id="bTarget">🎯 Ціль</button>
    <button id="bMenu">☰ Меню</button>
  </div>
</div>

<div id="sheet" class="sheet hidden"><div id="sheetBody"></div></div>
<input id="fileIn" type="file" accept=".pmtiles" class="hidden">

<script>
'use strict';
// ---------- налаштування ----------
const CFG = {
  maxAccuracy: 150,          // м — гірше вважається ненадійним
  maxSpeed: 60,              // м/с (~216 км/г) — швидше = стрибок/спуфінг
  lostAfter: 12000,          // мс без фіксації → рахункова навігація
  goodToRecover: 4,          // скільки поспіль хороших фіксацій, щоб повернутись до GPS
  recoverMaxGap: 800,        // м — GPS має бути поблизу оцінки, інакше питаємо
};
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('ws_' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ws_' + k, JSON.stringify(v)); } catch {} },
};

// ---------- геометрія ----------
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) {
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearing(a, b) {
  const y = Math.sin(rad(b.lng - a.lng)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat))*Math.sin(rad(b.lat)) - Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng - a.lng));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
function move(p, brg, m) {
  const d = m / R, t = rad(brg), la = rad(p.lat), lo = rad(p.lng);
  const la2 = Math.asin(Math.sin(la)*Math.cos(d) + Math.cos(la)*Math.sin(d)*Math.cos(t));
  const lo2 = lo + Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(la), Math.cos(d) - Math.sin(la)*Math.sin(la2));
  return { lat: deg(la2), lng: deg(lo2) };
}
const fmtDist = m => m < 1000 ? Math.round(m) + ' м' : (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' км';
const dirName = b => ['Пн','ПнСх','Сх','ПдСх','Пд','ПдЗх','Зх','ПнЗх'][Math.round(b / 45) % 8];

// ---------- стан ----------
const S = {
  pos: store.get('lastPos', null),       // {lat,lng} — наша найкраща оцінка
  heading: store.get('lastHeading', 0),
  speed: 0,                               // м/с
  mode: 'none',                           // gps | weak | dr | none
  manualDR: false,
  drSpeed: store.get('drSpeed', 50 / 3.6),
  unc: 0,                                 // невизначеність, м
  lastFix: null,                          // остання прийнята GPS фіксація {lat,lng,t}
  lastFixTime: 0,
  goodStreak: 0,
  pendingGps: null,                       // GPS, що «повернувся» далеко від оцінки
  compass: null, useCompass: store.get('useCompass', false),
  follow: true, tapMode: null,
  target: store.get('target', null),
  places: store.get('places', []),
  spdFactor: store.get('spdFactor', 1),   // ваша швидкість відносно типової для дороги (вчиться за GPS)
};

// ---------- карта ----------
const map = L.map('map', { zoomControl: false, attributionControl: true })
  .setView(S.pos ? [S.pos.lat, S.pos.lng] : [50.45, 30.52], S.pos ? 15 : 6);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap',
});
let offlineLayer = null;

const meIcon = L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
  html: '<svg class="me-icon" id="meSvg" viewBox="0 0 30 30" style="width:30px;height:30px"><circle cx="15" cy="15" r="13" fill="#fff"/><path d="M15 4 L23 24 L15 19 L7 24 Z" fill="#2563eb"/></svg>' });
const me = L.marker([0, 0], { icon: meIcon, interactive: false, zIndexOffset: 1000 });
const uncCircle = L.circle([0, 0], { radius: 1, color: '#3b82f6', weight: 1, fillOpacity: .12, interactive: false });
const rawGps = L.circleMarker([0, 0], { radius: 6, color: '#ef4444', weight: 2, fillOpacity: .2, interactive: false });
const targetMk = L.marker([0, 0], { title: 'Ціль' });
const placeLayer = L.layerGroup().addTo(map);
const trail = L.polyline([], { color: '#2563eb', weight: 4, opacity: .5 }).addTo(map);

// ---------- маршрут (прокладається онлайн, зберігається й працює офлайн) ----------
const routeLine = L.polyline([], { color: '#7c3aed', weight: 6, opacity: .7, interactive: false }).addTo(map);
let RT = null; // { pts:[[lat,lng]], cum:[м], cumT:[с], spd:[м/с], steps, total, idx, along, off, said:{} }
const P = a => ({ lat: a[0], lng: a[1] });
const MAX_ROUTES = 8;
// збережені маршрути: [{id, name, target, pts, spd, steps, dist, dur, saved}]
let ROUTES = store.get('routes', []);
{ // перенесення маршруту зі старої версії
  const old = store.get('route', null);
  if (Array.isArray(old) && old.length > 1 && !ROUTES.length) {
    ROUTES = [{ id: 'r' + Date.now(), name: (S.target && S.target.name) || 'Маршрут', target: S.target, pts: old, spd: null, steps: [], saved: Date.now() }];
    store.set('routes', ROUTES); store.set('activeRoute', ROUTES[0].id);
  }
  store.set('route', null);
}
function saveRoutes() {
  while (ROUTES.length > MAX_ROUTES) ROUTES.shift();
  for (;;) { // якщо пам'яті браузера не вистачає — видаляємо найстаріші
    try { localStorage.setItem('ws_routes', JSON.stringify(ROUTES)); return; }
    catch { if (ROUTES.length <= 1) return; ROUTES.shift(); }
  }
}

function setRoute(r) {
  if (!r || !r.pts || r.pts.length < 2) {
    RT = null; routeLine.setLatLngs([]); store.set('activeRoute', null); $('reroute').classList.add('hidden'); renderStep(); return;
  }
  const pts = r.pts, cum = [0], cumT = [0];
  for (let i = 1; i < pts.length; i++) {
    const d = dist(P(pts[i - 1]), P(pts[i]));
    cum.push(cum[i - 1] + d);
    const v = r.spd && r.spd[i - 1] ? r.spd[i - 1] / 10 : 50 / 3.6;
    cumT.push(cumT[i - 1] + d / Math.max(v, 1));
  }
  const total = cum[cum.length - 1];
  // кроки (повороти): позиція вздовж маршруту, масштабована до нашої довжини
  const k =r.stepsTotal ? total / r.stepsTotal : 1;
  const steps = (r.steps || []).map(s => ({ ...s, a: s.a * k }));
  RT = { id: r.id, name: r.name, pts, cum, cumT, spd: r.spd, steps, total, idx: -1, along: 0, off: Infinity, said: {} };
  routeLine.setLatLngs(pts);
  store.set('activeRoute', r.id);
}
const segSpeed = i => RT && RT.spd && RT.spd[i] ? RT.spd[i] / 10 : null;
function timeLeft() {
  if (!RT) return null;
  const i = Math.max(0, RT.idx), seg = RT.cum[i + 1] - RT.cum[i] || 1;
  const tAt = RT.cumT[i] + (RT.cumT[i + 1] - RT.cumT[i]) * Math.min(1, (RT.along - RT.cum[i]) / seg);
  return (RT.cumT[RT.cumT.length - 1] - tAt) / (S.spdFactor || 1);
}
function projectOnSeg(p, a, b) {
  const k = Math.cos(rad(p.lat));
  const ax = a[1] * k, ay = a[0], dx = b[1] * k - ax, dy = b[0] - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((p.lng * k - ax) * dx + (p.lat - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  const pt = { lat: a[0] + (b[0] - a[0]) * t, lng: a[1] + (b[1] - a[1]) * t };
  return { t, pt, d: dist(p, pt) };
}
function locateOnRoute(p, full) {
  const n = RT.pts.length;
  full = full || RT.idx < 0;
  const from = full ? 0 : Math.max(0, RT.idx - 50), to = full ? n - 1 : Math.min(n - 1, RT.idx + 400);
  let best = null;
  for (let i = from; i < to; i++) {
    const r = projectOnSeg(p, RT.pts[i], RT.pts[i + 1]);
    if (!best || r.d < best.d) best = { ...r, i };
  }
  if (!full && best && best.d > 500) return locateOnRoute(p, true);
  return best;
}
function updateRoutePos(full) {
  if (!RT || !S.pos) return;
  const r = locateOnRoute(S.pos, full);
  if (!r) return;
  RT.idx = r.i; RT.along = RT.cum[r.i] + (RT.cum[r.i + 1] - RT.cum[r.i]) * r.t; RT.off = r.d;
}
function pointAt(along) {
  along = Math.max(0, Math.min(RT.total, along));
  let lo = 0, hi = RT.cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (RT.cum[m] <= along) lo = m; else hi = m; }
  const a = RT.pts[lo], b = RT.pts[hi], seg = RT.cum[hi] - RT.cum[lo], t = seg ? (along - RT.cum[lo]) / seg : 0;
  return { pos: { lat: a[0] + (b[0] - a[0]) * t, lng: a[1] + (b[1] - a[1]) * t }, heading: bearing(P(a), P(b)), idx: lo };
}
const onRoute = () => RT && RT.off < Math.max(250, S.unc * 1.5);

async function buildRoute() {
  if (!S.target) return;
  if (!S.pos) { say('Спершу вкажіть свою позицію («📍 Я тут»), потім прокладіть маршрут.'); return; }
  say('Прокладаю маршрут…');
  const f = S.pos, t = S.target;
  const url = `https://router.project-osrm.org/route/v1/driving/${f.lng},${f.lat};${t.lng},${t.lat}?overview=full&geometries=geojson&alternatives=false&steps=true&annotations=speed`;
  try {
    const r = await fetch(url);
    const j = await r.json();
    if (j.code !== 'Ok' || !j.routes || !j.routes[0]) throw new Error(j.message || j.code || 'немає маршруту');
    const route = j.routes[0];
    const pts = route.geometry.coordinates.map(c => [+c[1].toFixed(5), +c[0].toFixed(5)]);
    const ann = route.legs[0].annotation && route.legs[0].annotation.speed;
    const spd = ann && ann.length === pts.length - 1 ? ann.map(v => Math.round(v * 10)) : null;
    let a = 0; const steps = [];
    for (const s of route.legs[0].steps) {
      const st = stepText(s);
      if (st) steps.push({ a: Math.round(a), t: st.t, i: st.i, n: st.n });
      a += s.distance;
    }
    const rec = { id: 'r' + Date.now(), name: t.name || 'Маршрут', target: { ...t }, pts, spd, steps, stepsTotal: a,
      dist: route.distance, dur: route.duration, saved: Date.now() };
    ROUTES = ROUTES.filter(x => !(x.target && dist(x.target, t) < 200));
    ROUTES.push(rec); saveRoutes();
    setRoute(rec); updateRoutePos(true); renderTarget();
    $('reroute').classList.add('hidden');
    setFollow(false); map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
    say(`Маршрут ${fmtDist(RT.total)}, ~${fmtTime(route.duration)}, ${steps.length} підказок. Збережено — працює без інтернету.`);
    speak(`Маршрут прокладено. ${Math.round(RT.total / 1000)} кілометрів.`);
  } catch (e) {
    say('Не вдалося прокласти маршрут — потрібен інтернет. (' + e.message + ')');
  }
}
const fmtTime = s => { const m = Math.round(s / 60); return m < 60 ? m + ' хв' : Math.floor(m / 60) + ' год ' + (m % 60) + ' хв'; };

// ---------- підказки поворотів (текст українською з даних OSRM) ----------
const MOD = { 'right': ['праворуч', '↱'], 'left': ['ліворуч', '↰'], 'slight right': ['плавно праворуч', '↗'],
  'slight left': ['плавно ліворуч', '↖'], 'sharp right': ['різко праворуч', '↱'], 'sharp left': ['різко ліворуч', '↰'],
  'straight': ['прямо', '↑'], 'uturn': ['розворот', '↶'] };
function stepText(s) {
  const m = s.maneuver, type = m.type, mod = MOD[m.modifier] || ['', '↑'];
  const road = s.ref ? s.ref.split(';')[0] : (s.name || '');
  const on = road ? ' на ' + road : '';
  const exitN = m.exit ? m.exit + '-й з’їзд' : 'з’їзд';
  switch (type) {
    case 'depart': return { t: 'Рушайте' + (road ? ' — ' + road : ''), i: '↑', n: road };
    case 'arrive': return { t: 'Ви прибули до місця призначення', i: '🏁', n: '' };
    case 'roundabout': case 'rotary': case 'roundabout turn':
      return { t: 'На кільці — ' + exitN + on, i: '⟳', n: road };
    case 'exit roundabout': case 'exit rotary': return null;
    case 'fork': return { t: 'Тримайтеся ' + (/right/.test(m.modifier) ? 'правіше' : 'лівіше') + on, i: mod[1], n: road };
    case 'merge': return { t: 'Перестройтеся' + on, i: mod[1], n: road };
    case 'on ramp': return { t: 'В’їзд ' + mod[0] + on, i: mod[1], n: road };
    case 'off ramp': return { t: 'З’їжджайте ' + mod[0] + on, i: mod[1], n: road };
    case 'new name': case 'continue': case 'notification': case 'use lane':
      if (!m.modifier || m.modifier === 'straight') return null;
      return { t: 'Тримайтеся ' + mod[0] + on, i: mod[1], n: road };
    default: // turn, end of road
      if (m.modifier === 'uturn') return { t: 'Розворот' + on, i: '↶', n: road };
      if (!m.modifier || m.modifier === 'straight') return { t: 'Прямо' + on, i: '↑', n: road };
      return { t: 'Поверніть ' + mod[0] + on, i: mod[1], n: road };
  }
}
function nextStep() {
  if (!RT || !RT.steps.length) return null;
  return RT.steps.find(s => s.a > RT.along + 5) || null;
}
function roundDist(d) { return d >= 1000 ? (Math.round(d / 500) * 500 / 1000).toString().replace('.', ',') + ' км' : (d >= 200 ? Math.round(d / 100) * 100 : Math.round(d / 50) * 50) + ' метрів'; }
function renderStep() {
  const el = $('step');
  const s = onRoute() ? nextStep() : null;
  if (!s) { el.classList.add('hidden'); return; }
  const d = s.a - RT.along;
  el.classList.remove('hidden');
  $('stepIcon').textContent = s.i;
  $('stepDist').textContent = fmtDist(d);
  $('stepText').textContent = s.t;
  // голос: заздалегідь і перед самим маневром
  const fast = S.speed > 70 / 3.6, far = fast ? 1000 : 500, near = fast ? 250 : 120;
  const key = s.a;
  if (!RT.said[key]) RT.said[key] = 0;
  if (RT.said[key] < 1 && d <= far && d > near * 1.5) { RT.said[key] = 1; speak('Через ' + roundDist(d) + ' ' + lowerFirst(s.t)); }
  else if (RT.said[key] < 2 && d <= near) { RT.said[key] = 2; speak(s.i === '🏁' ? s.t : lowerFirst(s.t).replace(/^./, c => c.toUpperCase())); }
}
const lowerFirst = t => t.charAt(0).toLowerCase() + t.slice(1);

function setTarget(p, name) {
  S.target = { lat: p.lat, lng: p.lng, name: name || '' }; store.set('target', S.target);
  setRoute(null); renderTarget(); buildRoute();
}

// ---------- голос ----------
let voiceOn = store.get('voice', true), lastSpoken = {};
function speak(text, kind) {
  if (!voiceOn || !('speechSynthesis' in window) || !text) return;
  if (kind) { if (Date.now() - (lastSpoken[kind] || 0) < 20000) return; lastSpoken[kind] = Date.now(); }
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'uk-UA';
    const v = speechSynthesis.getVoices().find(v => /^uk/i.test(v.lang));
    if (v) u.voice = v;
    u.rate = 1.05;
    speechSynthesis.speak(u);
  } catch {}
}

map.on('dragstart', () => setFollow(false));
map.on('click', e => onMapTap(e.latlng));

// ---------- GPS ----------
function onFix(p) {
  const c = p.coords, now = p.timestamp || Date.now();
  const fix = { lat: c.latitude, lng: c.longitude, t: now, acc: c.accuracy,
    speed: c.speed, heading: c.heading };
  rawGps.setLatLng([fix.lat, fix.lng]);
  if (!map.hasLayer(rawGps)) rawGps.addTo(map);

  let bad = null;
  if (!(c.accuracy <= CFG.maxAccuracy)) bad = 'weak';
  if (S.lastFix) {
    const dt = Math.max((now - S.lastFix.t) / 1000, 0.5);
    const v = dist(S.lastFix, fix) / dt;
    if (v > CFG.maxSpeed && dist(S.lastFix, fix) > 300) bad = 'jump';
  }
  if (fix.speed != null && fix.speed > CFG.maxSpeed) bad = 'jump';
  // звірка з реальною швидкістю авто з OBD: підмінений GPS «їде» не так, як машина
  if (!bad && obdFresh()) {
    if (fix.speed != null && Math.abs(fix.speed - OBD.speed) > 12) bad = 'obd';
    if (S.lastFix && OBD.speed < 1 && now - S.lastFix.t < 10000 && dist(S.lastFix, fix) > 150) bad = 'obd';
  }

  $('acc').textContent = Math.round(c.accuracy) + ' м';

  if (bad) {
    S.goodStreak = 0;
    if (bad === 'jump' || bad === 'obd') {
      say(bad === 'obd' ? '⚠️ GPS не збігається зі швидкістю авто (OBD) — ймовірне підмінення. Ігнорую.'
        : '⚠️ Стрибок координат — ймовірне підмінення GPS (спуфінг). Ігнорую.');
      speak('Увага! Ймовірна підміна GPS. Веду без супутників.', 'spoof');
      enterDR('spoof');
    } else if (S.mode === 'gps') {
      setMode('weak');
    }
    return;
  }

  // хороша фіксація
  S.goodStreak++;
  const inDR = S.mode === 'dr' || S.manualDR;
  if (inDR) {
    // повертаємось до GPS тільки після кількох стабільних фіксацій поспіль
    S.lastFix = fix; // для перевірки стрибків між ними
    if (S.manualDR || S.goodStreak < CFG.goodToRecover) return;
    if (S.pos && dist(S.pos, fix) > Math.max(CFG.recoverMaxGap, S.unc * 2)) {
      S.pendingGps = fix;
      $('useGps').classList.remove('hidden');
      say('GPS знову є, але показує ' + fmtDist(dist(S.pos, fix)) + ' від оцінки. Перевірте й натисніть «Прийняти GPS».');
      return;
    }
  }
  acceptFix(fix);
}

function acceptFix(fix) {
  S.pendingGps = null; $('useGps').classList.add('hidden');
  if (S.lastFix && fix.speed == null) {
    const dt = (fix.t - S.lastFix.t) / 1000;
    if (dt > 0) S.speed = dist(S.lastFix, fix) / dt;
  } else S.speed = fix.speed || 0;
  if (fix.heading != null && !isNaN(fix.heading) && S.speed > 2) S.heading = fix.heading;
  else if (S.lastFix && dist(S.lastFix, fix) > 8) S.heading = bearing(S.lastFix, fix);
  if (S.speed > 2) { S.drSpeed = S.speed; store.set('drSpeed', S.drSpeed); }
  S.pos = { lat: fix.lat, lng: fix.lng };
  S.unc = fix.acc; S.lastFix = fix; S.lastFixTime = Date.now();
  const wasGps = S.mode === 'gps', wasDR = S.mode === 'dr';
  setMode('gps');
  if (wasDR) speak('GPS відновлено.', 'back');
  updateRoutePos();
  // навчання: наскільки ви їдете швидше/повільніше за типову швидкість дороги
  if (onRoute() && RT.off < 60 && S.speed > 4 && !MOT.stopped) {
    const sv = segSpeed(RT.idx);
    if (sv) {
      const ratio = Math.max(0.5, Math.min(1.6, S.speed / sv));
      S.spdFactor = S.spdFactor * 0.97 + ratio * 0.03;
      if (Math.random() < 0.1) store.set('spdFactor', S.spdFactor);
    }
  }
  if (RT && RT.off > 200 && RT.along < RT.total - 100) {
    $('reroute').classList.remove('hidden');
    say('Ви зійшли з маршруту (' + fmtDist(RT.off) + '). Можна перебудувати, якщо є інтернет.');
    speak('Ви зійшли з маршруту.', 'off');
  } else if (!wasGps) say('');
  render(true);
}

function onGpsError(e) {
  if (e.code === 1) say('Доступ до геолокації заборонено. Працює лише ручний режим («Я тут»).');
}

function startGps() {
  if (!('geolocation' in navigator)) { say('Геолокація недоступна в цьому браузері.'); return; }
  navigator.geolocation.watchPosition(onFix, onGpsError, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}

// ---------- рахункова навігація (dead reckoning) ----------
function enterDR(reason) {
  if (S.mode !== 'dr') {
    setMode('dr');
    if (reason === 'lost') {
      say('GPS зник — рахункова навігація. Звіряйте швидкість зі спідометром, уточнюйте «Я тут».');
      speak('Сигнал GPS втрачено. Веду за оцінкою.', 'lost');
    }
  }
  if (reason === 'spoof') S.lastFixTime = 0;
}

let lastTick = performance.now();
function tick() {
  const now = performance.now(), dt = Math.min((now - lastTick) / 1000, 5);
  lastTick = now;
  if (!S.manualDR && S.mode !== 'dr' && S.lastFixTime && Date.now() - S.lastFixTime > CFG.lostAfter) enterDR('lost');
  $('obdTag').classList.toggle('hidden', !obdFresh());
  if (obdFresh() && OBD.speed > 1) S.drSpeed = OBD.speed; // запам'ятати на випадок втрати OBD
  if (S.mode === 'gps' && !S.manualDR && obdFresh()) $('spd').textContent = Math.round(OBD.speed * 3.6);
  if ((S.mode === 'dr' || S.manualDR) && S.pos) {
    const vel = drVelocity();
    const m = vel.v * dt;
    updDrSpeed();
    if (onRoute()) {
      // їдемо вздовж збереженого маршруту — бічна похибка зникає
      if (m > 0 && RT.along < RT.total) {
        const q = pointAt(RT.along + m);
        RT.along = Math.min(RT.total, RT.along + m); RT.idx = q.idx; RT.off = 0;
        S.pos = q.pos; S.heading = q.heading;
        S.unc += m * 0.03 + 0.2 * dt;
        if (RT.along >= RT.total) { updDrSpeed(); say('Ви на місці (за оцінкою).'); }
      }
    } else {
      const h = (S.useCompass && S.compass != null) ? S.compass : S.heading;
      S.heading = h;
      if (m > 0) {
        S.pos = move(S.pos, h, m);
        S.unc += m * 0.07 + 0.3 * dt;
        updateRoutePos();
      }
    }
    S.speed = vel.v;
    render(false);
  }
}
setInterval(tick, 1000);

// компас (у машині може бути неточним через метал — тому вимкнено за замовчуванням)
function onOrient(e) {
  let h = null;
  if (e.webkitCompassHeading != null) h = e.webkitCompassHeading;
  else if (e.absolute && e.alpha != null) h = (360 - e.alpha) % 360;
  if (h != null) {
    const scr = (screen.orientation && screen.orientation.angle) || 0;
    S.compass = (h + scr) % 360;
  }
}
async function enableCompass() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') return false;
    }
  } catch { return false; }
  window.addEventListener('deviceorientationabsolute', onOrient, true);
  window.addEventListener('deviceorientation', onOrient, true);
  return true;
}

// ---------- автозупинка: телефон відчуває, що авто стоїть ----------
const MOT = { buf: [], std: null, stopped: false, since: 0, calStop: null, calMove: null, nS: 0, nM: 0,
  on: store.get('autostop', true), cal: store.get('motCal', null) };
if (MOT.cal) { MOT.calStop = MOT.cal[0]; MOT.calMove = MOT.cal[1]; MOT.nS = MOT.nM = 30; }
window.addEventListener('devicemotion', e => {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a || a.x == null) return;
  const t = performance.now();
  MOT.buf.push([t, Math.hypot(a.x, a.y, a.z)]);
  while (MOT.buf.length && t - MOT.buf[0][0] > 2000) MOT.buf.shift();
});
const motThreshold = () => (MOT.nS >= 20 && MOT.nM >= 20 && MOT.calMove > MOT.calStop * 1.5)
  ? Math.sqrt(MOT.calStop * MOT.calMove) : 0.12;
setInterval(() => {
  const b = MOT.buf;
  if (b.length < 15) { MOT.std = null; MOT.stopped = false; return; }
  const m = b.reduce((s, x) => s + x[1], 0) / b.length;
  MOT.std = Math.sqrt(b.reduce((s, x) => s + (x[1] - m) ** 2, 0) / b.length);
  // автокалібрування: поки GPS надійний, запам'ятовуємо «вібрацію стоянки» і «вібрацію руху»
  if (S.mode === 'gps' && !S.manualDR && S.lastFixTime && Date.now() - S.lastFixTime < 3000) {
    const ema = (o, v) => o == null ? v : o * 0.95 + v * 0.05;
    if (S.speed < 0.5) { MOT.calStop = ema(MOT.calStop, MOT.std); MOT.nS++; }
    else if (S.speed > 5) { MOT.calMove = ema(MOT.calMove, MOT.std); MOT.nM++; }
    if (MOT.nS >= 20 && MOT.nM >= 20 && (MOT.nS + MOT.nM) % 20 === 0) store.set('motCal', [MOT.calStop, MOT.calMove]);
  }
  const still = MOT.std < motThreshold();
  if (still !== MOT.stopped) {
    if (!MOT.since) MOT.since = Date.now();
    if (Date.now() - MOT.since > (still ? 3000 : 1000)) { MOT.stopped = still; MOT.since = 0; }
  } else MOT.since = 0;
}, 500);

// ---------- OBD-II адаптер (ELM327 Bluetooth LE): справжня швидкість з авто ----------
const OBD = { dev: null, tx: null, speed: null, t: 0, buf: '', wait: null, timer: null, busy: false, status: 'не під’єднано', manualOff: false };
const OBD_SERVICES = [0xfff0, 0xffe0, 0x18f0, 'e7810a71-73ae-499d-8c15-faa9aef0c3f2'];
const obdFresh = () => OBD.speed != null && Date.now() - OBD.t < 4000;
function obdStatus(s) {
  OBD.status = s;
  const el = document.getElementById('obdSt'); if (el) el.textContent = s;
  $('obdTag').classList.toggle('hidden', !obdFresh());
}
function obdCmd(cmd, timeout) {
  return new Promise(res => {
    const to = setTimeout(() => { OBD.wait = null; OBD.buf = ''; res(''); }, timeout);
    OBD.wait = r => { clearTimeout(to); res(r); };
    const data = new TextEncoder().encode(cmd + '\r');
    const w = OBD.tx.properties.writeWithoutResponse ? OBD.tx.writeValueWithoutResponse(data) : OBD.tx.writeValueWithResponse(data);
    w.catch(() => { clearTimeout(to); OBD.wait = null; res(''); });
  });
}
async function obdSetup(dev) {
  obdStatus('з’єднання…');
  const srv = await dev.gatt.connect();
  let rx = null, tx = null;
  for (const id of OBD_SERVICES) {
    let s; try { s = await srv.getPrimaryService(id); } catch { continue; }
    for (const c of await s.getCharacteristics()) {
      if (!rx && (c.properties.notify || c.properties.indicate)) rx = c;
      if (!tx && (c.properties.write || c.properties.writeWithoutResponse)) tx = c;
    }
    if (rx && tx) break;
    rx = tx = null;
  }
  if (!rx || !tx) throw new Error('пристрій не схожий на OBD-адаптер ELM327 BLE');
  OBD.tx = tx;
  await rx.startNotifications();
  rx.addEventListener('characteristicvaluechanged', e => {
    OBD.buf += new TextDecoder().decode(e.target.value);
    if (OBD.buf.includes('>')) { const r = OBD.buf; OBD.buf = ''; const w = OBD.wait; OBD.wait = null; if (w) w(r); }
  });
  obdStatus('налаштування адаптера…');
  for (const c of ['ATZ', 'ATE0', 'ATL0', 'ATS0', 'ATH0', 'ATSP0']) await obdCmd(c, c === 'ATZ' ? 3000 : 1500);
  obdStatus('під’єднано, чекаю дані авто…');
  clearInterval(OBD.timer); OBD.busy = false;
  OBD.timer = setInterval(async () => {
    if (OBD.busy) return; OBD.busy = true;
    try {
      const r = (await obdCmd('010D', 3000)).replace(/\s/g, '').toUpperCase();
      const m = r.match(/410D([0-9A-F]{2})/);
      if (m) { OBD.speed = parseInt(m[1], 16) / 3.6; OBD.t = Date.now(); obdStatus('працює: ' + Math.round(OBD.speed * 3.6) + ' км/г'); }
      else if (/UNABLETOCONNECT|NODATA|ERROR/.test(r)) obdStatus('адаптер є, але авто не відповідає (запаліть двигун)');
    } catch {}
    OBD.busy = false;
  }, 700);
}
async function obdConnect() {
  if (!navigator.bluetooth) { alert('Bluetooth недоступний. Потрібен Chrome на Android і відкритий сайт через https.'); return; }
  try {
    const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: OBD_SERVICES });
    OBD.dev = dev; OBD.manualOff = false;
    dev.addEventListener('gattserverdisconnected', () => {
      clearInterval(OBD.timer); OBD.speed = null; obdStatus('зв’язок втрачено, перепідключаю…');
      if (!OBD.manualOff) setTimeout(() => obdSetup(dev).catch(() => obdStatus('відключено — під’єднайте знову')), 3000);
    });
    await obdSetup(dev);
  } catch (e) { obdStatus(e.name === 'NotFoundError' ? 'не вибрано' : 'помилка: ' + e.message); }
}
function obdDisconnect() {
  OBD.manualOff = true; clearInterval(OBD.timer); OBD.speed = null;
  if (OBD.dev && OBD.dev.gatt.connected) OBD.dev.gatt.disconnect();
  obdStatus('не під’єднано');
}

// яку швидкість використовувати без GPS
function drVelocity() {
  if (obdFresh()) return { v: OBD.speed, src: 'obd' };
  if (MOT.on && MOT.stopped) return { v: 0, src: 'stop' };
  if (RT && onRoute()) {
    if (RT.along >= RT.total - 1) return { v: 0, src: 'end' };
    const sv = segSpeed(Math.max(0, RT.idx));
    if (sv) return { v: sv * S.spdFactor, src: 'road' }; // типова швидкість цієї ділянки дороги
  }
  return { v: S.drSpeed, src: 'manual' };
}

// ---------- UI ----------
function setMode(m) {
  S.mode = m;
  const b = $('badge');
  const dr = S.manualDR || m === 'dr';
  const map_ = {
    gps: ['b-ok', 'GPS ✓'], weak: ['b-warn', 'GPS слабкий'],
    dr: ['b-dr', 'Без GPS (оцінка)'], none: ['b-none', 'Немає GPS'],
  };
  const [cls, txt] = S.manualDR ? ['b-dr', 'Без GPS (ручний)'] : map_[m];
  b.className = cls; b.textContent = txt;
  $('drRow').classList.toggle('hidden', !dr);
  $('bDR').classList.toggle('on', S.manualDR);
  updDrSpeed();
}
function say(t) { $('msg').textContent = t; }
function setFollow(v) { S.follow = v; $('bFollow').classList.toggle('on', v); if (v) render(true); }
function updDrSpeed() {
  const v = drVelocity();
  $('drSpeed').innerHTML = v.src === 'obd' ? 'OBD ' + Math.round(v.v * 3.6) + ' км/г'
    : v.src === 'stop' ? 'стоїмо' : v.src === 'end' ? 'на місці'
    : v.src === 'road' ? '~' + Math.round(v.v * 3.6) + ' км/г<br><small style="font-size:12px;color:var(--muted)">за дорогою ×' + S.spdFactor.toFixed(2) + '</small>'
    : Math.round(v.v * 3.6) + ' км/г';
}

let lastSave = 0, lastTrail = null;
function render(pan) {
  if (!S.pos) return;
  const ll = [S.pos.lat, S.pos.lng];
  me.setLatLng(ll); if (!map.hasLayer(me)) me.addTo(map);
  uncCircle.setLatLng(ll).setRadius(Math.max(S.unc, 5)); if (!map.hasLayer(uncCircle)) uncCircle.addTo(map);
  const svg = document.getElementById('meSvg');
  if (svg) svg.style.transform = `rotate(${S.heading}deg)`;
  $('spd').textContent = Math.round(S.speed * 3.6);
  if (S.mode !== 'gps') $('acc').textContent = '±' + fmtDist(S.unc);
  if (lastTrail && dist(lastTrail, S.pos) > 2000) trail.setLatLngs([]); // ручне переміщення / прийнятий GPS — новий відрізок
  if (!lastTrail || dist(lastTrail, S.pos) > 15) { trail.addLatLng(ll); lastTrail = S.pos; }
  if (S.follow) map.panTo(ll, { animate: false });
  if (Date.now() - lastSave > 5000) { store.set('lastPos', S.pos); store.set('lastHeading', S.heading); lastSave = Date.now(); }
  renderTarget();
}

function renderTarget() {
  renderStep();
  if (!S.target) { $('target').classList.add('hidden'); if (map.hasLayer(targetMk)) map.removeLayer(targetMk); return; }
  targetMk.setLatLng([S.target.lat, S.target.lng]); if (!map.hasLayer(targetMk)) targetMk.addTo(map);
  $('target').classList.remove('hidden');
  $('tName').textContent = S.target.name || '';
  if (!S.pos) { $('tDist').textContent = '—'; return; }
  const d = dist(S.pos, S.target), b = bearing(S.pos, S.target);
  if (RT && RT.off < 300) {
    const left = Math.max(0, RT.total - RT.along);
    $('tDist').textContent = fmtDist(left) + ' маршрутом';
    const tl = RT.spd ? timeLeft() : (S.speed > 3 ? left / S.speed : null);
    $('tBear').textContent = (tl != null && left > 50 ? 'ще ~' + fmtTime(tl) + ' · ' : '') + 'по прямій ' + fmtDist(d);
  } else {
    $('tDist').textContent = fmtDist(d);
    $('tBear').textContent = 'напрям ' + dirName(b) + ' (' + Math.round(b) + '°), по прямій' + (RT ? ' · поза маршрутом' : '');
  }
  $('arrow').style.transform = `rotate(${(b - S.heading + 360) % 360}deg)`;
}

function hint(t) { const h = $('hint'); h.textContent = t; h.classList.toggle('hidden', !t); }

function onMapTap(ll) {
  const p = { lat: ll.lat, lng: ll.lng };
  if (S.tapMode === 'here') {
    S.pos = p; S.unc = 30; S.tapMode = 'heading';
    if (S.mode !== 'gps' && !S.manualDR) setMode('dr');
    updateRoutePos(true);
    if (onRoute()) { S.pos = pointAt(RT.along).pos; S.heading = pointAt(RT.along).heading; } // прилипнути до маршруту
    render(false);
    hint('Тепер торкніться точки на дорозі ПОПЕРЕДУ — це задасть напрям руху. (Або «Я тут» ще раз, щоб пропустити.)');
  } else if (S.tapMode === 'heading') {
    if (S.pos) S.heading = bearing(S.pos, p);
    S.tapMode = null; hint(''); render(false);
    say('Позицію і напрям задано вручну.');
  } else if (S.tapMode === 'target') {
    S.tapMode = null; hint(''); setTarget(p, '');
  } else if (S.tapMode === 'place') {
    const name = prompt('Назва місця:', 'Місце ' + (S.places.length + 1));
    S.tapMode = null; hint('');
    if (name) { S.places.push({ ...p, name }); store.set('places', S.places); drawPlaces(); }
  }
}

function drawPlaces() {
  placeLayer.clearLayers();
  S.places.forEach(pl => L.circleMarker([pl.lat, pl.lng], { radius: 7, color: '#f59e0b', fillOpacity: .9 })
    .bindTooltip(pl.name, { permanent: false }).addTo(placeLayer));
}

// ---------- кнопки ----------
$('bFollow').onclick = () => setFollow(!S.follow);
function setHere(p, unc, label) {
  S.pos = { lat: p.lat, lng: p.lng }; S.unc = unc;
  if (S.mode !== 'gps' && !S.manualDR) setMode('dr');
  updateRoutePos(true);
  if (onRoute()) { const q = pointAt(RT.along); S.pos = q.pos; S.heading = q.heading; } // прилипнути до маршруту
  setFollow(true); render(true);
  if (label) say('Позицію задано: ' + label + (onRoute() ? ' (на маршруті)' : ''));
}
$('bHere').onclick = () => {

// ---------- офлайн-пошук населених пунктів (GeoNames, вбудований файл) ----------
let PLACES = null, placesLoading = null;
const norm = s => s.toLowerCase().replace(/[’'`ʼ]/g, '').replace(/ё/g, 'е').replace(/ы/g, 'и').replace(/э/g, 'е').trim();
function loadPlaces() {
  if (PLACES) return Promise.resolve(PLACES);
  if (!placesLoading) placesLoading = fetch('places.json').then(r => r.json()).then(j => {
    const obl = j.o.map(o => o.replace(/^Місто\s+/, 'м. ').replace(/\s*[Оо]бласть$/, ' обл.').replace(/^Чернігівська$/, 'Чернігівська обл.'));
    PLACES = j.p.map(p => ({ name: p[0], k: norm(p[0]), lat: p[1], lng: p[2], obl: obl[p[3]] || '', rank: p[4] }));
    return PLACES;
  }).catch(e => { placesLoading = null; throw e; });
  return placesLoading;
}
async function searchPlaces(q) {
  const list = await loadPlaces(), k = norm(q);
  if (k.length < 2) return [];
  const here = S.pos;
  const res = [];
  for (const p of list) {
    const i = p.k.indexOf(k);
    if (i < 0) continue;
    const score = (i === 0 ? 0 : 1000) + (p.k === k ? -500 : 0) + p.rank * 100 + (here ? Math.min(dist(here, p) / 10000, 99) : 0);
    res.push([score, p]);
  }
  res.sort((a, b) => a[0] - b[0]);
  return res.slice(0, 8).map(x => x[1]);
}
function bindPlaceSearch(input, out, icon, pick) {
  let timer = null;
  input.oninput = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const q = input.value.trim();
      if (q.length < 2) { out.innerHTML = ''; return; }
      try {
        const list = await searchPlaces(q);
        out.innerHTML = list.length ? list.map((x, i) => `<div class="place"><span>${esc(x.name)}
          <small style="color:var(--muted)">· ${esc(x.obl)}${S.pos ? ' · ' + fmtDist(dist(S.pos, x)) : ''}</small></span>
          <button data-pp="${i}">${icon}</button></div>`).join('') : '<p>Не знайдено. Перевірте написання.</p>';
        out.querySelectorAll('[data-pp]').forEach(b => b.onclick = () => pick(list[+b.dataset.pp]));
      } catch { out.innerHTML = '<p>Список населених пунктів ще не завантажено — відкрийте застосунок один раз з інтернетом.</p>'; }
    }, 150);
  };
  setTimeout(() => input.focus(), 50);
}

// ---------- офлайн PMTiles (зберігається в IndexedDB) ----------
function idb() {
  return new Promise((res, rej) => { const r = indexedDB.open('waysafe', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function idbOp(mode, fn) { const db = await idb(); return new Promise((res, rej) => {
  const tx = db.transaction('files', mode), q = fn(tx.objectStore('files'));
  tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); }
const idbGet = k => idbOp('readonly', s => s.get(k));
const idbPut = (k, v) => idbOp('readwrite', s => s.put(v, k));
const idbDel = k => idbOp('readwrite', s => s.delete(k));

async function offlineInfo() {
  try { const f = await idbGet('map'); return f ? `${esc(f.name)} (${(f.blob.size / 1048576).toFixed(0)} МБ) — активна` : 'не завантажено'; }
  catch { return 'недоступно'; }
}
function useOsm() { if (offlineLayer) { map.removeLayer(offlineLayer); offlineLayer = null; } if (!map.hasLayer(osm)) osm.addTo(map); }
function usePmtiles(blob, name) {
  try {
    const file = new File([blob], name || 'map.pmtiles');
    const p = new pmtiles.PMTiles(new pmtiles.FileSource(file));
    const layer = protomapsL.leafletLayer({ url: p, flavor: 'light', lang: 'uk', attribution: '© OpenStreetMap, Protomaps' });
    if (offlineLayer) map.removeLayer(offlineLayer);
    if (map.hasLayer(osm)) map.removeLayer(osm);
    offlineLayer = layer.addTo(map);
    p.getHeader().then(h => { if (!S.pos && h.centerLat) map.setView([h.centerLat, h.centerLon], h.centerZoom || 8); }).catch(() => {});
    return true;
  } catch (e) { console.error(e); alert('Не вдалося відкрити файл карти: ' + e.message); useOsm(); return false; }
}
$('fileIn').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  closeSheet(); say('Зберігаю карту в пам’ять телефону…');
  try {
    if (navigator.storage && navigator.storage.persist) await navigator.storage.persist();
    await idbPut('map', { name: f.name, blob: f });
    const saved = await idbGet('map');
    usePmtiles(saved.blob, saved.name);
    say('Офлайн-карту збережено: ' + f.name);
  } catch (err) { say('Помилка збереження: ' + err.message + '. Можливо, бракує місця.'); }
  e.target.value = '';
};

function locationText() {
  if (!S.pos) { alert('Позиція ще невідома. Дочекайтеся GPS або вкажіть «Я тут».'); return null; }
  const la = S.pos.lat.toFixed(5), lo = S.pos.lng.toFixed(5);

  const how = S.mode === 'gps' ? 'GPS ±' + fmtDist(S.unc) : 'оцінка без GPS ±' + fmtDist(S.unc);

// ---------- нічний режим ----------
function sunAltitude(lat, lng, d) {
  const r = Math.PI / 180, J = d / 86400000 + 2440587.5 - 2451545;
  const M = (357.5291 + 0.98560028 * J) * r;
  const C = (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) * r;
  const Ls = M + C + 102.9372 * r + Math.PI, e = 23.4397 * r;
  const dec = Math.asin(Math.sin(Ls) * Math.sin(e)), ra = Math.atan2(Math.sin(Ls) * Math.cos(e), Math.cos(Ls));
  const H = (280.16 + 360.9856235 * J) * r + lng * r - ra;
  return Math.asin(Math.sin(lat * r) * Math.sin(dec) + Math.cos(lat * r) * Math.cos(dec) * Math.cos(H)) / r;
}
function applyTheme() {
  const th = store.get('theme', 'auto'), p = S.pos || { lat: 50.45, lng: 30.52 };
  const night = th === 'night' || (th === 'auto' && sunAltitude(p.lat, p.lng, new Date()) < -3);
  document.body.classList.toggle('night', night);
}

// ---------- екран не гасне ----------
let wakeLock = null, wakeOn = store.get('wake', true);
async function wake() { wakeOn = true; store.set('wake', true);
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
function unwake() { wakeOn = false; store.set('wake', false); if (wakeLock) wakeLock.release(); wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wakeOn) wake(); });

// ---------- старт ----------
(async function init() {
  try { const f = await idbGet('map'); if (f) usePmtiles(f.blob, f.name); else useOsm(); } catch { useOsm(); }
  { const id = store.get('activeRoute', null), r = ROUTES.find(x => x.id === id); if (r) { setRoute(r); updateRoutePos(true); } }
  applyTheme(); setInterval(applyTheme, 60000);
  loadPlaces().catch(() => {});
  drawPlaces(); setMode('none'); render(true); renderTarget();
  if (S.useCompass) enableCompass();
  if (wakeOn) wake();
  startGps();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!S.pos) say('Очікую GPS… Або натисніть «Я тут» і вкажіть позицію на карті.');
})();
</script>
</body>
</html>
